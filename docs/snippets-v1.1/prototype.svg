<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880"><style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#252936;font-size:16px}.muted{fill:#777e8b;font-size:14px}.h{font-size:24px;font-weight:600}.blue{fill:#245edb}.white{fill:white}.small{font-size:13px}</style><rect width="1440" height="880" fill="#eceef2"/><text x="60" y="60" class="blue small">CLIPBOARD ASSISTANT / V1.1 / DESIGN PROPOSAL</text><text x="60" y="104" style="font-size:32px;font-weight:600">片段库：保存、查找、填写，再使用</text><text x="60" y="137" class="muted">待评审原型 · 虚构示例 · 关键字仅在面板内匹配 · 不监听其他应用输入</text>
<rect x="60" y="180" width="820" height="520" rx="12" fill="white" stroke="#cbd0d9"/><path d="M60 240H880M230 240V650M490 240V650M60 650H880" stroke="#d9dce2"/><text x="80" y="217">历史 / 片段</text><rect x="260" y="194" width="410" height="32" rx="6" fill="#f0f2f6"/><text x="274" y="215" class="muted">搜索片段，或输入 ;reply</text><rect x="704" y="194" width="150" height="32" rx="6" fill="#245edb"/><text x="728" y="216" class="white">＋ 新建片段</text><text x="80" y="278" class="muted">我的片段</text><text x="80" y="322">全部片段</text><text x="80" y="365">未分组</text><rect x="72" y="388" width="146" height="40" rx="6" fill="#e9efff"/><text x="80" y="414" class="blue">客户沟通</text><text x="80" y="460">个人资料</text><text x="80" y="528" class="blue">＋ 新建分组</text><text x="250" y="278" class="muted">客户沟通 · 2 个片段</text><rect x="242" y="300" width="236" height="92" rx="6" fill="#e9efff"/><text x="258" y="333" class="blue">客户回复</text><text x="258" y="368" class="muted">;reply · 2 个变量</text><text x="258" y="435">会议邀请</text><text x="258" y="468" class="muted">;meet · 1 个变量</text><text x="514" y="278" class="muted">客户沟通 / ;reply</text><text x="514" y="325" class="h">客户回复</text><rect x="512" y="349" width="340" height="170" rx="6" fill="#f5f6f8"/><text x="528" y="382">你好 {{customer}}，</text><text x="528" y="425">关于你反馈的「{{issue}}」，</text><text x="528" y="458">我们已收到并安排处理。</text><text x="514" y="553" class="muted">使用前填写变量，填写值不会保存</text><rect x="514" y="580" width="150" height="40" rx="6" fill="#245edb"/><text x="538" y="607" class="white">填写并粘贴</text><text x="684" y="607" class="blue">只复制</text><text x="790" y="607">编辑</text><text x="80" y="680" class="muted">↵ 粘贴　 ·　⌘↵ 只复制　 ·　⇧↵ 纯文本粘贴</text>
<rect x="930" y="180" width="450" height="260" rx="12" fill="white" stroke="#cbd0d9"/><text x="954" y="219" class="h">01　保存片段</text><text x="954" y="256" class="muted">标题 / 分组 / 可选关键字</text><rect x="954" y="272" width="402" height="40" rx="6" fill="#f5f6f8"/><text x="968" y="298">客户回复　 /　 客户沟通　 /　 ;reply</text><text x="954" y="345">正文使用 {{name}} 声明变量</text><text x="954" y="379" class="muted">变量设置：显示名、必填/选填、单行/多行</text><text x="954" y="415" class="blue">取消　　　　　　　　　保存片段</text>
<rect x="930" y="464" width="450" height="300" rx="12" fill="white" stroke="#cbd0d9"/><text x="954" y="504" class="h">02　填写并使用</text><text x="954" y="539" class="muted">customer（必填）</text><rect x="954" y="551" width="402" height="36" rx="6" fill="#f5f6f8"/><text x="968" y="575">陈女士</text><text x="954" y="616" class="muted">issue（必填）</text><rect x="954" y="628" width="402" height="36" rx="6" fill="#f5f6f8"/><text x="968" y="652">订单进度</text><text x="954" y="699" class="muted">预览：你好 陈女士，关于你反馈的……</text><text x="954" y="740" class="blue">取消　　　　　　　　　粘贴回原应用</text><text x="60" y="777" class="h">设计原则</text><text x="60" y="815">片段独立保存　 /　删除分组保留内容　 /　变量值仅本次有效　 /　只复制不发送按键</text><text x="60" y="851" class="muted">完整交互见 prototype.html；字段约束、错误与验收标准见 prd.md；本图不代表已实现功能。</text></svg>
